name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[turso] pytest

      - name: Run tests
        run: python -m pytest -q

  # Deploys the mcp-tools container of the scanner-web-backend Cloud Run service.
  # See README.md#deployment for the equivalent manual command and what this
  # can't do for you (schema changes, first-time infra setup).
  deploy:
    name: Deploy mcp-tools sidecar
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_ID: gen-lang-client-0305286339
      REGION: us-central1
      REPO: us-central1-docker.pkg.dev/gen-lang-client-0305286339/scanner
      SERVICE: scanner-web-backend
      CONTAINER: mcp-tools

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/429301876637/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-deployer@gen-lang-client-0305286339.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud builds submit \
            --tag "$REPO/scanner-mcp:${{ github.sha }}" \
            --project "$PROJECT_ID"
          gcloud artifacts docker tags add \
            "$REPO/scanner-mcp:${{ github.sha }}" "$REPO/scanner-mcp:latest" \
            --project "$PROJECT_ID"

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --container "$CONTAINER" \
            --image "$REPO/scanner-mcp:${{ github.sha }}"
