services:
  # Shares the same Turso database as `backend`, keyed by the same Clerk user_id.
  # Set TURSO_DATABASE_URL=file:./.data/scanner.db (no token needed) to test this
  # compose file locally without a real Turso account.
  mcp-server:
    build:
      context: .
    environment:
      SCANNER_MCP_HTTP_HOST: 0.0.0.0
      SCANNER_MCP_HTTP_PORT: 5050
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
    expose:
      - "5050"

  backend:
    build:
      context: ../horus-scanner-server
    depends_on:
      - mcp-server
    environment:
      PORT: 8080
      MCP_SERVER_URL: http://mcp-server:5050/mcp
      MCP_SERVER_TRANSPORT: http
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../horus-scanner-frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
